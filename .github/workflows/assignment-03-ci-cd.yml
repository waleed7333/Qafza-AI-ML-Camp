name: Assignment 03 CI/CD

on:
  push:
    branches:
      - main
      - assignment-03
    paths:
      - "assignments/03-olist-late-delivery-mlops/**"
      - ".github/workflows/assignment-03-ci-cd.yml"
  pull_request:
    paths:
      - "assignments/03-olist-late-delivery-mlops/**"
      - ".github/workflows/assignment-03-ci-cd.yml"

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignments/03-olist-late-delivery-mlops

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            assignments/03-olist-late-delivery-mlops/requirements/runtime.txt
            assignments/03-olist-late-delivery-mlops/requirements/dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/runtime.txt -r requirements/dev.txt

      - name: Lint
        run: python -m ruff check app src scripts tests

      - name: Check formatting
        run: python -m ruff format --check app src scripts tests

      - name: Run tests
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push API image
        uses: docker/build-push-action@v7
        with:
          context: assignments/03-olist-late-delivery-mlops
          file: assignments/03-olist-late-delivery-mlops/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/waleed7333/qafza-assignment-03:${{ github.sha }}
